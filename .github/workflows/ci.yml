name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - run: npm run check-versions
      - name: Inspect packages
        run: |
          shopt -s nullglob
          for f in dist/*.boppa; do node tools/cli/src/cli.ts inspect "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
